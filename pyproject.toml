[project]
name = "portfolio-admin-api"
version = "0.1.0"
description = "Admin CMS API for the Mohammed Majeed J portfolio"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "python-multipart>=0.0.20",
  "email-validator>=2.2",
  "itsdangerous>=2.2",
  # Runtime, not just tests: the deploy hook posts to the static host's build
  # endpoint. It arrived transitively via TestClient before, which would have
  # made a fresh production install fail on import.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.8",
]

# Declared explicitly, because `pip install .` — which is Render's build command
# — otherwise fails outright:
#
#   error: Multiple top-level packages discovered in a flat-layout:
#          ['app', 'alembic', 'storage']
#
# setuptools' automatic discovery refuses to guess between them, and `alembic/`
# (migrations) and `storage/` (uploaded media) are not packages to ship. Naming
# the build backend and restricting discovery to `app*` makes the install
# deterministic instead of dependent on what happens to be in the directory.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Content strings, not code — wrapping them would corrupt the copy.
"app/seed.py" = ["E501"]
# Autogenerated by Alembic — not hand-maintained, so not style-checked.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
