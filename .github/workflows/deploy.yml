name: Deploy backend to EC2

# Tests run on a GitHub-hosted runner; the deploy runs on a self-hosted runner
# ON the instance. GitHub's hosted runners have thousands of rotating egress
# IPs, so reaching this box over SSH would mean opening port 22 to the whole
# internet. The runner dials out instead — nothing inbound, no key in CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # matches the interpreter on the server
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Tests
        # The suite uses its own fixtures and is given no DATABASE_URL, so it
        # cannot reach the production database.
        run: pytest -q

  deploy:
    needs: test
    runs-on: [self-hosted, ec2, deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Stage the release, keeping the running one
        run: |
          set -euo pipefail
          APP=/opt/portfolio/backend
          test -f app/main.py || { echo "checkout does not look like the backend"; exit 1; }

          sudo rm -rf /opt/portfolio/backend.prev
          sudo cp -a "$APP" /opt/portfolio/backend.prev

          # Explicit excludes: no .env, no virtualenv, no caches, no git data.
          # /etc/portfolio-api.env is outside this path and never touched.
          sudo rsync -a --delete \
            --exclude '.git' --exclude '.github' \
            --exclude '.env' --exclude '.env.*' \
            --exclude '.venv' --exclude 'venv' \
            --exclude '__pycache__' --exclude '*.pyc' \
            --exclude '.pytest_cache' --exclude '.ruff_cache' \
            --exclude 'storage' \
            ./ "$APP"/
          sudo chown -R portfolio:portfolio "$APP"

      - name: Install dependencies and restart
        run: |
          set -euo pipefail
          sudo -u portfolio /opt/portfolio/venv/bin/pip install -q .
          sudo systemctl restart portfolio-api
          sleep 8

      - name: Health check, roll back on failure
        run: |
          set -uo pipefail
          APP=/opt/portfolio/backend
          ok=1
          systemctl is-active --quiet portfolio-api || ok=0
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1:8000/api/health)
          echo "service=$(systemctl is-active portfolio-api) health=$code"
          [ "$code" = "200" ] || ok=0

          if [ "$ok" -ne 1 ]; then
            echo "--- startup log (DSNs redacted) ---"
            sudo journalctl -u portfolio-api -n 30 --no-pager | sed -E 's#postgresql[^ ]*#[REDACTED]#g'
            echo "rolling back"
            sudo rsync -a --delete /opt/portfolio/backend.prev/ "$APP"/
            sudo chown -R portfolio:portfolio "$APP"
            sudo -u portfolio /opt/portfolio/venv/bin/pip install -q . || true
            sudo systemctl restart portfolio-api
            sleep 6
            echo "after rollback: $(systemctl is-active portfolio-api) $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)"
            exit 1
          fi
          echo "backend deployed and healthy"
